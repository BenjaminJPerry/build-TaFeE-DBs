# Default slurm profile for running the pipeline on the eRI.
# Based on: https://github.com/jdblischak/smk-simple-slurm
# Adapted for Snakemake 9.x using executor-plugin-cluster-generic.
# Previous v7 cluster-directive profile is preserved at eRI/config.yaml.v7-backup.

executor: cluster-generic
cluster-generic-submit-cmd: >-
  mkdir -p logs/{rule} &&
  sbatch
  --account={resources.account}
  --partition={resources.partition}
  --cpus-per-task={threads}
  --mem={resources.mem_gb}G
  --time={resources.time}
  --job-name=smk-{rule}-{wildcards}
  --output=logs/{rule}/{rule}-{wildcards}-%j.out
  --parsable
cluster-generic-cancel-cmd: scancel
cluster-generic-status-cmd: workflow/scripts/status.py
default-resources:
  - account=2023-mbie-rumen-gbs
  - partition=compute
  - time=480
  - mem_gb=24
restart-times: 3
max-jobs-per-second: 10
local-cores: 2
latency-wait: 600
jobs: 100
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: greedy
use-conda: True
