# Generalized kraken2 build configuration.
#
# Each entry in `databases:` produces a directory named:
#   kraken2-gtdb-r{release}-{label}-{shortsha}/   (when gtdb_release is set)
#   kraken2-{label}-{shortsha}/                    (otherwise)
# where shortsha = first 8 hex chars of sha256(sorted, deduped accessions).
#
# Optional per-DB `name_override:` bypasses auto-naming (useful for preserving legacy paths).

output_root: GTDB

databases:

  supp220:
    label: supp
    gtdb_release: "220.0"
    supplemental_accessions: resources/genomes/GTDB-220.0_supplemental_accessions.txt
    build_params:
      kmer_len: 35
      minimizer_len: 31
      minimizer_spaces: 7
    resources:
      fetch_taxonomy: {threads: 4,  mem_gb: 8,    time: 120,  partition: compute}
      add_to_library: {threads: 32, mem_gb: 100,  time: 7200, partition: compute}
      build:          {threads: 64, mem_gb: 1600, time: 7200, partition: hugemem}

  hosts:
    label: hosts
    # no gtdb_release -> hosts-only build
    supplemental_accessions: resources/genomes/hosts_accessions.txt
    build_params:
      kmer_len: 35
      minimizer_len: 31
      minimizer_spaces: 7
    resources:
      fetch_taxonomy: {threads: 2,  mem_gb: 4,    time: 60,   partition: compute}
      add_to_library: {threads: 16, mem_gb: 24,   time: 2880, partition: compute}
      build:          {threads: 64, mem_gb: 1600, time: 1440, partition: hugemem}
